<div class="toast" *ngIf="toastMessage" [class.toast-success]="toastType === 'success'" [class.toast-error]="toastType === 'error'">
  {{ toastMessage }}
</div>

<main class="login-page">
  <section class="login-card">
    <h1>Entrar</h1>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label for="username">E-mail ou usuário</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="usuario@teste"
        autocomplete="username"
      />
      <small class="field-error" *ngIf="usernameControl.touched && usernameControl.hasError('required')">
        Campo obrigatório.
      </small>
      <small class="field-error" *ngIf="usernameControl.touched && usernameControl.hasError('usernameOrEmail')">
        Formato de e-mail válido ou usuário (3 a 50 caracteres) obrigatório.
      </small>

      <label for="password">Senha</label>
      <div class="password-wrapper">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
          {{ showPassword ? 'ocultar senha' : 'ver senha' }}
        </button>
      </div>
      <small class="field-error" *ngIf="passwordControl.touched && passwordControl.hasError('required')">
        Campo obrigatório.
      </small>

      <a href="#" class="forgot-password">Esqueci minha senha</a>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
